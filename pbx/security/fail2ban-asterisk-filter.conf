# Fail2Ban filter for Asterisk PJSIP security events (installed to
# /etc/fail2ban/filter.d/asterisk-pashu.conf by install.sh).
[Definition]
failregex = ^.*<host> failed to authenticate.*$
            ^.*Request 'REGISTER' from '<host>' failed.*$
            ^.*Request 'INVITE' from '<host>' failed.*$
            ^.*No matching endpoint found for '<host>'.*$
            ^.*Call from '<host>' .* rejected.*$
ignoreregex =
# <host> matches IPs; hostnames in REGISTER lines are resolved by fail2ban.
